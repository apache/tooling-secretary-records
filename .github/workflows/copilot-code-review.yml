# The runner Copilot's code review runs on.
#
# Without this file the review falls back to `ubuntu-latest`, which is billed through the
# account whose payments are blocked, so the job never starts. What lands then is not a
# failure anybody sees: the review still arrives, headed "Copilot couldn't run its full
# agentic review because it didn't start before the timeout", and a degraded pass reads the
# diff hunks without the repository around them. On BAT's #818 and #826 that produced findings
# about a guard three lines above the hunk, and about an import the module's
# `from __future__ import annotations` already answers - twice each, across six rounds.
#
# The same move as BAT's `3067c857` and `3f436ba1`, which put `build.yml` and `analyze.yml` on the
# ASF infra runner for the same reason. The labels are build.yml's, minus the size: this job
# prepares an environment rather than running the suite.
#
# Only `steps`, `permissions`, `runs-on`, `services`, `snapshot` and `timeout-minutes` are
# read from the job below, and only from the copy on the default branch - a change here does
# nothing until it merges, and cannot be tested by the review round of the pull request that
# makes it.
name: Copilot code review

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/copilot-code-review.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/copilot-code-review.yml

permissions:
  contents: read

jobs:
  # Named for Copilot, which looks for this job and ignores the rest of the file. Renaming it
  # puts the review back on ubuntu-latest, in silence.
  copilot-setup-steps:
    runs-on:
      - runs-on=${{ github.run_id }}
      - cpu=4
      - family=c7i
      - image=ubuntu24-full-x64
      - tag=infra
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Nothing to install. The review reads the tree; it does not build it, and the toolchain
      # this repository runs everything else through is a container the review has no use for.
      # A job needs a step, so this is the step.
      - name: Ready
        run: echo "Copilot code review runs on the infra runner"
